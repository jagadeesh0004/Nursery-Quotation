server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: nursery-quotation-system
  main:
    lazy-initialization: true

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      initialization-fail-timeout: 60000
      data-source-properties:
        prepareThreshold: 0

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration
    encoding: UTF-8
    schemas: public

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=24h

supabase:
  jwks-uri: ${SUPABASE_JWKS_URI}
  issuer: ${SUPABASE_ISSUER}
  project-id: ${SUPABASE_PROJECT_ID}

app:
  file:
    upload-dir: ${UPLOAD_DIR:./uploads}
    logos-dir: ${LOGOS_DIR:./uploads/logos}
    pdfs-dir: ${PDFS_DIR:./uploads/pdfs}
  pdf:
    cache-enabled: ${PDF_CACHE_ENABLED:false}
    weasyprint-path: ${WEASYPRINT_PATH:weasyprint}
  frontend:
    url: ${FRONTEND_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

#FIX #6: Rate Limiting Configuration
resilience4j:
  ratelimiter:
    instances:
      pdf-generation:
        registerHealthIndicator: true
        limitRefreshPeriod: 1m
        limitForPeriod: 10
        timeoutDuration: 5s
        eventConsumerBufferSize: 100

logging:
  level:
    root: INFO
    com.nursery: INFO
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF
    org.flywaydb: INFO
    org.springframework: INFO
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
  file:
    name: logs/app.log

devtools:
  restart:
    enabled: false
